name: 更新資料並部署網站

on:
  schedule:
    # 平日台灣時間 06:30（美股收盤後）、15:00（台股收盤後）、22:00（融資資料公布後）、22:45（融資晚公布時補抓）。
    # 台灣時間為 UTC+8（無夏令時間）；cron 用 UTC。06:30 台北在美股冬令與夏令收盤之後。
    - cron: "30 22 * * 0-4" # 06:30 台北（美股收盤後）；週一為週日 UTC
    - cron: "0 7 * * 1-5" # 15:00 台北（台股收盤後）
    - cron: "0 14 * * 1-5" # 22:00 台北（融資資料公布後）
    # 22:45 台北：輕量補一班。證交所上市融資餘額約 21:00–22:00 公布，量大時更晚；22:00 那班可能剛好撞上晚公布，
    # 抓不到就沿用上次（scripts/twse_margin.py），這班再試一次；仍沒有的話次日 06:30 會再補上。
    - cron: "45 14 * * 1-5" # 22:45 台北（融資晚公布時補抓）
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    name: 更新訊號資料
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      # 證交所台指日線快取不進版控；還原後每天只需重抓前月與當月。
      # 上市融資餘額（走勢頁圖表）的快取也在此樹下：data/cache/trend/twse/margin/。
      - name: 還原台指證交所日線快取
        uses: actions/cache@v4
        with:
          path: data/cache/trend/twse
          key: twse-taiex-${{ github.run_id }}
          restore-keys: |
            twse-taiex-

      # 燈號 #1 QQQ／SOXX／SMH 的發行商官方歷史；不進版控。還原後上游失敗可沿用舊序列。
      - name: 還原 ETF 發行商資金流快取
        uses: actions/cache@v4
        with:
          path: data/cache/etf
          key: etf-issuer-hist-${{ github.run_id }}
          restore-keys: |
            etf-issuer-hist-

      - name: 執行追蹤器（個別來源失敗會沿用上次並標資料過期；整個程式失敗則此步驟失敗）
        env:
          TZ: Asia/Taipei
          PYTHON: python
        run: ./run.sh

      # 要排在 ./run.sh 之後：走勢頁的燈號摘要讀 data/latest.json。
      # Yahoo 抓不到時腳本仍以 0 結束，只把 trend/status.json 標成過期、保留上次成功的 data.json／data.js。
      - name: 更新 SOX／NDX／SPX 與台指走勢資料（不影響燈號規則）
        run: TZ=Asia/Taipei python scripts/update_trend.py

      - name: 更新首頁指數報價快取（不影響燈號規則）
        continue-on-error: true
        run: TZ=Asia/Taipei python scripts/index_quotes.py

      - name: 更新首頁指數本益比快照（不影響燈號規則）
        continue-on-error: true
        run: TZ=Asia/Taipei python scripts/index_pe.py --min-age-hours 0

      - name: 檢查是否有資料變更
        id: diff
        run: |
          git add -A data reports
          # 只收走勢的產生檔；trend/index.html、trend/ta-book 不在每日自動 commit 範圍
          git add -f trend/data.json trend/data.js trend/status.json
          # 歷史跌幅頁的「現在本波下跌」由 update_trend.py 刷新；只收這兩個產生檔，不收 index.html
          git add -f trend/drawdowns/drawdowns.json trend/drawdowns/drawdowns.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit 並推送
        if: steps.diff.outputs.changed == 'true'
        env:
          TZ: Asia/Taipei
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): 自動更新訊號 $(date '+%Y-%m-%d %H:%M (台北時間 UTC+8)')"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    name: 部署到 GitHub Pages
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout（main 最新 commit）
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 組出 _site
        run: ./scripts/build_site.sh _site

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # 上傳後立刻部署偶爾會報「No artifacts named github-pages」（GitHub 端還沒登記好 artifact），
      # 所以失敗時等 30 秒再試，最多三次
      - name: 部署
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 等 30 秒再部署（第 2 次）
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: 部署（第 2 次）
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 等 60 秒再部署（第 3 次）
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: 部署（第 3 次）
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: 部署網址
        id: deployment
        run: echo "page_url=${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}" >> "$GITHUB_OUTPUT"
